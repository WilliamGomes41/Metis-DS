# Two-container sandbox (see docs/SECURITY_SANDBOX.md):
# - workspace: the Codespace/editor attaches here. It has egress (default
#   network) so the Codespaces agent and VS Code server can start. It MAG NIET
#   join the sandbox network: jobs go through files (requests dir + read-only
#   control volume), so untrusted rt code NOOIT reaches a container with egress.
# - runner: executes tests/scans. Internal network ONLY (no egress), no
#   capabilities, no new privileges, read-only root filesystem, no docker socket.
# - control: no network at all; sole writer of the control volume (requests,
#   ready, .exit, .log). Runner and workspace mount it read-only, so tested code
#   MAG NIET a verdict forge or overwrite (#653 T5). The runner writes only to
#   its artifact dir; control copies results into the control volume.
# No docker-in-docker and no docker socket in any container.
services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: workspace
    command: sleep infinity
    volumes:
      - ..:/workspaces/metis:cached
      - sandbox_control:/sandbox-control:ro
    networks:
      - egress
    depends_on:
      control:
        condition: service_healthy
  runner:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      # Offline test assets (Playwright, Docling+models, PI-05 model, osv DB) baked at build time.
      target: runner
    command: ["bash", "/workspaces/metis/scripts/sandbox_runner.sh"]
    user: vscode
    working_dir: /workspaces/metis
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    # Repo is READ-ONLY in the runner so a test cannot modify code that the
    # egress-capable workspace could then push. Only the artifact dirs are writable;
    # the control volume (requests in, verdicts out) is read-only here.
    volumes:
      - ..:/workspaces/metis:ro
      - sandbox_control:/sandbox-control:ro
      - ../output/runtime/sandbox-artifacts:/workspaces/metis/output/runtime/sandbox-artifacts:rw
      # Host-side `docker network inspect` attestation (#653 T10); read-only.
      - ../output/runtime/sandbox-attest:/sandbox-attest:ro
      # security_sandbox.py writes reports here (RUNTIME); everything else stays read-only.
      - ../output/runtime/security-sandbox:/workspaces/metis/output/runtime/security-sandbox:rw
      # Host-visible startup diagnostics (readable from a recovery container).
      - ../output/runtime/sandbox-runner-diag:/workspaces/metis/output/runtime/sandbox-runner-diag:rw
    healthcheck:
      # Build fails hard (workspace waits on service_healthy) if the runner never
      # becomes ready, instead of a silent "runner not ready" later.
      test: ["CMD", "test", "-f", "/workspaces/metis/output/runtime/sandbox-artifacts/heartbeat"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    networks:
      sandbox:
        ipv4_address: 172.30.254.20
    # No resolver: Docker's embedded DNS forwards external names even on an
    # internal network (DNS exfil). sandbox-db is pinned via extra_hosts.
    dns:
      - 127.0.0.1
    dns_search: []
    extra_hosts:
      - "sandbox-db:172.30.254.10"
      - "sandbox-azurite:172.30.254.30"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/vscode
    depends_on:
      sandbox-db:
        condition: service_healthy
      sandbox-azurite:
        condition: service_started
  control:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: runner
    command: ["python", "/workspaces/metis/scripts/sandbox_control.py"]
    user: vscode
    working_dir: /workspaces/metis
    network_mode: none
    volumes:
      - ..:/workspaces/metis:ro
      - sandbox_control:/sandbox-control:rw
      - ../output/runtime/sandbox-requests:/workspaces/metis/output/runtime/sandbox-requests:rw
      - ../output/runtime/sandbox-artifacts:/workspaces/metis/output/runtime/sandbox-artifacts:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/sandbox-control/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      runner:
        condition: service_healthy
  # Blob emulator for CON-03. Internal network only (no egress), in-memory, fixed IP.
  sandbox-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000",
              "--inMemoryPersistence", "--skipApiVersionCheck", "--disableProductStyleUrl"]
    networks:
      sandbox:
        ipv4_address: 172.30.254.30
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  sandbox-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: metis_sandbox
      POSTGRES_PASSWORD: sandbox-only
      POSTGRES_DB: metis_security_test
    volumes:
      - sandbox_database:/var/lib/postgresql/data
    networks:
      sandbox:
        ipv4_address: 172.30.254.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metis_sandbox -d metis_security_test"]
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  egress: {}
  # Created --internal by initializeCommand on the host, which also writes the
  # `docker network inspect` attestation the runner verifies (#653 T10).
  sandbox:
    external: true
    name: metis-sandbox
volumes:
  sandbox_database:
  sandbox_control:
