rules:
  - id: metis-python-dynamic-evaluation
    message: Review dynamic code execution and trace any untrusted input to it.
    languages: [python]
    severity: WARNING
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
  - id: metis-python-shell-execution
    message: Review shell execution and trace how the command is constructed.
    languages: [python]
    severity: WARNING
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: os.system(...)
  - id: metis-python-disabled-tls-verification
    message: Review disabled TLS verification and whether this path is reachable.
    languages: [python]
    severity: WARNING
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
