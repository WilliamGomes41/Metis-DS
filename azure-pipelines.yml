trigger:
  batch: true
  branches:
    include:
      - main

pr: none

schedules:
- cron: "0 * * * *"
  displayName: Elk uur synchroniseren
  branches:
    include:
      - main
  always: true

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
  - repository: devops
    type: git
    name: Metis/Metis
    ref: refs/heads/main

steps:
- checkout: devops
  fetchDepth: 1
  path: s/devops

- bash: |
    set -euo pipefail

    git clone --bare \
      https://github.com/WilliamGomes41/Metis-DS.git \
      "$AGENT_TEMPDIRECTORY/metis-source.git"

    cd "$AGENT_TEMPDIRECTORY/metis-source.git"

    # Authenticatie geldt alleen voor de Azure DevOps-repository.
    export GIT_CONFIG_COUNT=1
    export GIT_CONFIG_KEY_0="http.${TARGET_URL}.extraheader"
    export GIT_CONFIG_VALUE_0="AUTHORIZATION: bearer ${AZURE_TOKEN}"

    git push "$TARGET_URL" --all
    git push "$TARGET_URL" --tags

    git for-each-ref \
      --format='%(objectname) %(refname)' \
      refs/heads refs/tags | sort > source-refs.txt

    git ls-remote --refs "$TARGET_URL" \
      'refs/heads/*' 'refs/tags/*' |
      awk '{print $1 " " $2}' |
      sort > target-refs.txt

    missing=$(comm -23 source-refs.txt target-refs.txt)
    if [ -n "$missing" ]; then
      echo "Controle mislukt: branches of tags verschillen."
      printf '%s\n' "$missing"
      exit 1
    fi

    echo "Controle geslaagd: alle bronbranches en tags zijn gekopieerd."
  displayName: GitHub naar Azure Repos kopiëren
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  env:
    AZURE_TOKEN: $(System.AccessToken)
    TARGET_URL: https://dev.azure.com/vvnmetis/Metis/_git/Metis
    GIT_TERMINAL_PROMPT: "0"