name: t11-lineage
on:
  push:
    branches: [t11-knowledge-revision-lineage]
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      METIS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/metis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pytest -q tests/test_t11_knowledge_revision_lineage.py --tb=short
