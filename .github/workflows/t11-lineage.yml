name: t11-lineage
on:
  push:
    branches: [t11-knowledge-revision-lineage]
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      METIS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/metis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pytest -q tests/test_closed_review_loop_v1.py tests/test_d3_3_human_recommendation_semantics.py tests/test_d3_4_confirmed_recommendation_serving.py tests/test_d4_3_human_relation_confirmation.py tests/test_d5_3b_review_routing_cutover.py tests/test_d5_4_review_interaction_evidence.py tests/test_decision_unit_construction.py tests/test_durable_publication_console_v1.py tests/test_lifecycle_withdrawal_recovery_v1.py tests/test_processing_diagnostics_export_v1.py tests/test_protocol_v2_13_kernel.py tests/test_quality_metrics_v1.py tests/test_recoverable_formation_v1.py tests/test_route_comparison_http_v1.py tests/test_source_bound_continuation_repair.py tests/test_source_cache_work_v1.py tests/test_t11_knowledge_revision_lineage.py tests/test_t8_materialisation_admission_integrity.py tests/test_t9_review_knowledge_authority.py tests/test_v212_kernel_v211_ingest_v210_console.py tests/test_v215_ingest_date_version_review_lanes.py tests/test_v216_review_page_researcher_bar.py tests/test_v228_structural_heading_nav_and_confirmed_strength_gate.py tests/test_v230_phase1_admission_gate.py tests/test_v230_phase3_review_cockpit.py tests/test_v230_phase4_passage_register_coverage_gold.py tests/test_v233_review_audit_regressions.py tests/test_vsa_meaningful_document_status_v1.py tests/test_vsa_publish_readiness_ui_v1.py tests/test_workflow_transaction_v1.py --tb=short -o faulthandler_timeout=60
