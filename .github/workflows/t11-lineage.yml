name: t11-lineage
on:
  push:
    branches: [t11-knowledge-revision-lineage]
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      METIS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/metis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - name: Diagnose concurrent publication and storage
        run: timeout 240s pytest -vv tests/test_stale_write_ux.py tests/test_console_review_completeness.py tests/test_processing_retry_postgres.py tests/test_wave5_gericht_vereenvoudigen.py tests/test_attempt_diagnostics_postgres.py tests/test_workflow_postgres_concurrency.py tests/test_decision_graph_native_concurrency.py tests/test_review_object_save_reliability.py tests/test_lifecycle_identity_v1.py tests/test_pre_review_failure_diagnostics_v1.py tests/test_security_harden_wave3.py tests/test_review_participation_management.py tests/test_workflow_topic_identity_v1.py tests/test_bounded_processing_lifecycle.py tests/test_docling_real_pdf.py tests/test_workflow_documents_cutover_v1.py tests/test_source_context_review_v1.py tests/test_azure_blob_publication_authority_v1.py tests/test_console_publication_c5.py tests/test_durable_publication_console_v1.py tests/test_protocol_v2_34_g2_publication_activation.py tests/test_publication_chain_recovery_guard_v1.py tests/test_publication_chain_recovery_v1.py tests/test_publication_registry_serving_authority_v1.py tests/test_published_working_revision_immutable_2b_local.py tests/test_published_working_revision_immutable_2b_postgres.py tests/test_published_working_revision_immutable_v1.py tests/test_storage_publication_v2.py tests/test_vsa_publication_readiness_v1.py --tb=short -o faulthandler_timeout=20
      - if: ${{ !cancelled() }}
        run: pytest -q tests/test_t4_single_knowledge_path_invariants.py tests/test_t5_t7_audit_repairs.py tests/test_t7_creator_cut.py tests/test_d5_3a_binding_aware_review_duty.py tests/test_review_queue_sql_parity_v1.py tests/test_closed_review_loop_v1.py tests/test_d3_3_human_recommendation_semantics.py tests/test_d3_4_confirmed_recommendation_serving.py tests/test_d4_3_human_relation_confirmation.py tests/test_d5_3b_review_routing_cutover.py tests/test_d5_4_review_interaction_evidence.py tests/test_decision_unit_construction.py tests/test_durable_publication_console_v1.py tests/test_lifecycle_withdrawal_recovery_v1.py tests/test_processing_diagnostics_export_v1.py tests/test_protocol_v2_13_kernel.py tests/test_quality_metrics_v1.py tests/test_recoverable_formation_v1.py tests/test_route_comparison_http_v1.py tests/test_source_bound_continuation_repair.py tests/test_source_cache_work_v1.py tests/test_t11_knowledge_revision_lineage.py tests/test_t8_materialisation_admission_integrity.py tests/test_t9_review_knowledge_authority.py tests/test_v212_kernel_v211_ingest_v210_console.py tests/test_v215_ingest_date_version_review_lanes.py tests/test_v216_review_page_researcher_bar.py tests/test_v228_structural_heading_nav_and_confirmed_strength_gate.py tests/test_v230_phase1_admission_gate.py tests/test_v230_phase3_review_cockpit.py tests/test_v230_phase4_passage_register_coverage_gold.py tests/test_v233_review_audit_regressions.py tests/test_vsa_meaningful_document_status_v1.py tests/test_vsa_publish_readiness_ui_v1.py tests/test_workflow_transaction_v1.py --tb=short -o faulthandler_timeout=60
