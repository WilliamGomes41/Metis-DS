name: deploy-production (ZIP route retired)

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject the retired production ZIP route
        shell: bash
        run: |
          echo "::error::production_zip_deploy_retired: use docs/AZURE_RELEASE_RUNBOOK.md and docs/agents/deployment-protocol.md (container image by digest)."
          exit 1
