name: deploy-production

# Production release remains explicit/manual until the production OIDC identity
# is proven healthy. The workflow itself owns checkout, verification, packaging,
# rollback-artifact retention and Azure ZIP deployment; no local/Work ZIP handoff.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Optioneel: volledige SHA op main. Leeg = huidige main-tip.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: metis-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.commit_sha || 'current main' }} to production
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_PRODUCTION_WEBAPP_NAME: ${{ vars.AZURE_PRODUCTION_WEBAPP_NAME }}
      METIS_DEPLOY_ENVIRONMENT: production
      METIS_DEPLOY_IDENTITY: metis-deploy-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || 'main' }}
          fetch-depth: 0
      - name: Resolve and validate exact main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ -n "$REQUESTED_SHA" ]; then
            test "${#REQUESTED_SHA}" -eq 40
            test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          fi
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$ACTUAL_SHA" origin/main
          echo "DEPLOY_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fail-closed production identity and target gate
        run: |
          python -c "from src.deploy_identity_v1 import assert_deploy_allowed; assert_deploy_allowed(environment='production', identity='${METIS_DEPLOY_IDENTITY}', target_app='${AZURE_PRODUCTION_WEBAPP_NAME}')"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python scripts/repository_preflight.py
      - run: pytest -q
      - name: Create fully deployable package with dependencies
        run: bash scripts/create_azure_deploy_package.sh "$RUNNER_TEMP/metis-console.zip"
      - name: Preserve exact deploy ZIP for rollback
        uses: actions/upload-artifact@v4
        with:
          name: metis-console-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/metis-console.zip
          if-no-files-found: error
          retention-days: 30
      - name: Sign in to Azure using the production deploy identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PRODUCTION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure per-environment storage app settings (no secrets)
        run: >-
          az webapp config appsettings set
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_PRODUCTION_WEBAPP_NAME }}"
          --settings
          G2_STORAGE_ACCOUNT="${{ vars.AZURE_PRODUCTION_STORAGE_ACCOUNT || 'aidataservice' }}"
          G2_BLOB_CONTAINER="${{ vars.AZURE_PRODUCTION_BLOB_CONTAINER || 'canonical-sources' }}"
          CONSOLE_DATA_ROOT="/home/data/metis-console"
          WEB_CONCURRENCY="1"
          CONSOLE_INSTANCE_COUNT="1"
      - name: Deploy application code only
        run: >-
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_PRODUCTION_WEBAPP_NAME }}"
          --src-path "$RUNNER_TEMP/metis-console.zip"
          --type zip
          --clean true
          --async false
      - name: Verify production health
        run: >-
          curl --fail --show-error --silent
          --retry 12 --retry-delay 5 --retry-connrefused
          "${{ vars.AZURE_PRODUCTION_APP_URL }}/health"
