name: deploy-production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Volledige SHA van een eerder op test geteste commit op main'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: metis-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.commit_sha }} to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Validate exact main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "${#REQUESTED_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python scripts/repository_preflight.py
      - run: pytest -q
      - name: Create exact source package
        run: scripts/create_azure_deploy_package.sh "$RUNNER_TEMP/metis-console.zip"
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy application code only
        run: >-
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_PRODUCTION_WEBAPP_NAME }}"
          --src-path "$RUNNER_TEMP/metis-console.zip"
          --type zip
          --clean true
          --async false
      - name: Verify production health
        run: >-
          curl --fail --show-error --silent
          --retry 12 --retry-delay 5 --retry-connrefused
          "${{ vars.AZURE_PRODUCTION_APP_URL }}/health"
