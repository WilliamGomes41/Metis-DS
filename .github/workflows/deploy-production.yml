name: deploy-production

# Protocol v2.22 wave C / owner lock 2026-09-03: production is manual.
# No on.push. MUST NOT activate until vvn-metis-console-test exists.
# Test identity cannot production; production identity cannot test.
# MUST NOT merge PR #82.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Volledige SHA van een eerder op test geteste commit op main'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: metis-production-deployment
  cancel-in-progress: false

jobs:
  inactive-until-test-app:
    name: Fail-closed until vvn-metis-console-test exists
    runs-on: ubuntu-latest
    steps:
      - name: Refuse production deploy while the named test app is missing
        run: |
          if [ "${{ vars.METIS_TEST_APP_READY }}" = "true" ]; then
            echo "METIS_TEST_APP_READY is true; production deploy job may run"
          else
            echo "deploy-production remains inactive: vvn-metis-console-test is not declared ready"
            exit 1
          fi

  deploy:
    name: Deploy ${{ inputs.commit_sha }} to production
    if: ${{ vars.METIS_TEST_APP_READY == 'true' }}
    needs: inactive-until-test-app
    runs-on: ubuntu-latest
    environment: production
    env:
      METIS_TEST_APP_READY: ${{ vars.METIS_TEST_APP_READY }}
      AZURE_PRODUCTION_WEBAPP_NAME: ${{ vars.AZURE_PRODUCTION_WEBAPP_NAME }}
      METIS_DEPLOY_ENVIRONMENT: production
      METIS_DEPLOY_IDENTITY: metis-deploy-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Validate exact main commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "${#REQUESTED_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fail-closed activation and identity gate
        run: |
          python -c "from src.deploy_identity_v1 import require_deploy_activation, require_activation_from_env, TEST_APP; require_deploy_activation(ready_flag='${{ vars.METIS_TEST_APP_READY }}', declared_app=TEST_APP); require_activation_from_env()"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python scripts/repository_preflight.py
      - run: pytest -q
      - name: Create fully deployable package with dependencies
        run: bash scripts/create_azure_deploy_package.sh "$RUNNER_TEMP/metis-console.zip"
      - name: Sign in to Azure using the production deploy identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PRODUCTION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure per-environment storage app settings (no secrets)
        run: >-
          az webapp config appsettings set
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_PRODUCTION_WEBAPP_NAME }}"
          --settings
          G2_STORAGE_ACCOUNT="${{ vars.AZURE_PRODUCTION_STORAGE_ACCOUNT || 'aidataservice' }}"
          G2_BLOB_CONTAINER="${{ vars.AZURE_PRODUCTION_BLOB_CONTAINER || 'canonical-sources' }}"
          CONSOLE_DATA_ROOT="/home/data/metis-console"
      - name: Deploy application code only
        run: >-
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_PRODUCTION_WEBAPP_NAME }}"
          --src-path "$RUNNER_TEMP/metis-console.zip"
          --type zip
          --clean true
          --async false
      - name: Verify production health
        run: >-
          curl --fail --show-error --silent
          --retry 12 --retry-delay 5 --retry-connrefused
          "${{ vars.AZURE_PRODUCTION_APP_URL }}/health"
