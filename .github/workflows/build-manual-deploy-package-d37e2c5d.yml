name: build-manual-deploy-package-d37e2c5d

on:
  push:
    branches:
      - ops/build-deploy-d37e2c5d

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d37e2c5dfd394ffdf5d0a6826437aa4a1433698a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deploy ZIP
        run: bash scripts/create_azure_deploy_package.sh "$RUNNER_TEMP/metis-console-d37e2c5d.zip"
      - name: Verify deploy ZIP
        run: |
          python - <<'PY'
          import os, zipfile
          p = os.path.join(os.environ["RUNNER_TEMP"], "metis-console-d37e2c5d.zip")
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              required = {
                  "data/audit/semantic_passage_safety_v1.json",
                  "config/deployed_commit.txt",
                  "src/console_asgi.py",
                  "src/pre_review_semantic_v1.py",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"missing required files: {missing}")
              marker = z.read("config/deployed_commit.txt").decode().strip()
              if marker != "d37e2c5dfd394ffdf5d0a6826437aa4a1433698a":
                  raise SystemExit(f"wrong deploy marker: {marker}")
              native = sorted(
                  n for n in names
                  if n.startswith(".python_packages/pydantic_core/_pydantic_core.")
                  and n.endswith(".so")
              )
              if len(native) != 1 or "cpython-312-" not in native[0] or "cpython-313-" in native[0]:
                  raise SystemExit(f"wrong pydantic_core native extension: {native}")
              timestamps = {info.date_time for info in z.infolist()}
              if (2026, 1, 1, 0, 0, 0) in timestamps:
                  raise SystemExit("stale fixed ZIP timestamp still present")
          print("deploy zip verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metis-console-d37e2c5d
          path: ${{ runner.temp }}/metis-console-d37e2c5d.zip
          if-no-files-found: error
          retention-days: 3
