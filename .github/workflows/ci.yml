name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  change-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Metis change contract
        run: python scripts/validate_change_contract.py

  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check domain contract import boundaries
        run: python scripts/check_architecture_boundaries.py

  test:
    needs: [change-contract, architecture-boundaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      METIS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/metis_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for release-control path mapping
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python scripts/repository_preflight.py
      - name: Release-control skill mapping
        run: python scripts/release_control_preflight.py --base origin/main
      - name: Generate Product API v1 contract
        run: python scripts/product_api_contract.py --write
      - name: Upload Product API contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-api-v1-openapi-${{ matrix.python-version }}
          path: output/runtime/product_api_v1.openapi.json
          if-no-files-found: error
      - name: Product API v1 backward compatibility
        run: python scripts/product_api_contract.py --check --base-ref origin/main
      - run: python -m compileall -q src
      - name: Verify architecture invariants
        run: pytest -q tests/test_architecture_invariants.py
      - run: pytest -q
      - name: Install isolated browser test tooling
        if: matrix.python-version == '3.12'
        run: |
          npm install --prefix "$RUNNER_TEMP/metis-browser" playwright@1.58.2
          "$RUNNER_TEMP/metis-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify desktop and mobile review workflows
        if: matrix.python-version == '3.12'
        run: |
          export METIS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/metis-browser/node_modules/playwright"
          export METIS_BROWSER_EXECUTABLE="$(node -e 'process.stdout.write(require(process.env.METIS_PLAYWRIGHT_MODULE).chromium.executablePath())')"
          pytest -q tests/test_browser_knowledge_context.py --basetemp="$RUNNER_TEMP/metis-browser-proof"
      - name: Upload synthetic browser evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: review-browser-desktop-mobile
          path: |
            ${{ runner.temp }}/metis-browser-proof/**/*.png
            ${{ runner.temp }}/metis-browser-proof/**/*.json
          if-no-files-found: warn


  deployment-package-artifact:
    name: Build exact main deployment ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe93afdfa22b9a2951e803ebe7e4d654b656b2f7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build official Azure deployment ZIP
        run: |
          python -m pip install --upgrade pip
          bash scripts/create_azure_deploy_package.sh "$RUNNER_TEMP/metis-console-fe93afdf-azure.zip"
      - name: Verify ZIP and embedded commit marker
        run: |
          unzip -t "$RUNNER_TEMP/metis-console-fe93afdf-azure.zip"
          test "$(unzip -p "$RUNNER_TEMP/metis-console-fe93afdf-azure.zip" config/deployed_commit.txt | tr -d '\r\n')" = "fe93afdfa22b9a2951e803ebe7e4d654b656b2f7"
          sha256sum "$RUNNER_TEMP/metis-console-fe93afdf-azure.zip" | tee "$RUNNER_TEMP/metis-console-fe93afdf-azure.zip.sha256"
      - name: Upload deployment package only
        uses: actions/upload-artifact@v4
        with:
          name: metis-console-fe93afdf-azure-package
          path: |
            ${{ runner.temp }}/metis-console-fe93afdf-azure.zip
            ${{ runner.temp }}/metis-console-fe93afdf-azure.zip.sha256
          if-no-files-found: error
          retention-days: 1
