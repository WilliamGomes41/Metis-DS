name: A06 native PostgreSQL proof
on:
  push:
    branches: [proof/a06-native-postgres]
permissions:
  contents: read
jobs:
  a06:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      METIS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/metis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.lock
      - name: Full A06 V3 ingest, native SQL rollback and separate process restart
        run: python -m pytest -q tests/test_a06_selected_occurrence_relations.py
