name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Replace obsolete runs of this workflow for the same PR. Each main push keeps
# its own group so its verification can finish independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Metis change contract
        run: python scripts/validate_change_contract.py

  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check domain contract import boundaries
        run: python scripts/check_architecture_boundaries.py

  characterization-evidence:
    needs: [change-contract, architecture-boundaries]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        volumes:
          - /tmp/metis-test-postgres-socket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      METIS_TEST_POSTGRES_DSN: host=/tmp/metis-test-postgres-socket dbname=metis_test user=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements.lock
            requirements-console.txt
            requirements-retrieval.txt
            pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - name: MET-23 native Review POST baseline
        timeout-minutes: 10
        env:
          REVIEW_PROOF_OUTPUT: output/review-post-902.json
        run: |
          bash scripts/test_postgres.sh > /dev/null
          python -m pytest -x -q tests/test_review_post_baseline_postgres.py \
            tests/test_t11_knowledge_revision_lineage.py::test_unchanged_review_retry_keeps_revision_and_legacy_history \
            tests/test_d5_4_review_interaction_evidence.py::test_second_review_uses_same_evidence_store_without_changing_object_tuple \
            tests/test_deterministic_review_repair_v1.py::test_source_unit_resolution_creates_new_proposal_and_no_revise_remains \
            tests/test_a08_heading_batch_atomic.py::test_success_duplicates_repeat_and_stale \
            tests/test_a08_heading_batch_atomic.py::test_native_batch_and_single_review_use_consistent_lock_order \
            tests/test_source_context_review_v1.py::test_native_context_and_publication_serialize_before_authority_read \
            tests/test_workflow_postgres_concurrency.py::test_different_object_concurrent_edits_both_survive \
            --junitxml=output/review-post-902.xml
      - name: Upload MET-23 native POST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-post-902
          overwrite: true
          path: output/review-post-902.*
          if-no-files-found: error
      - name: Characterization mutation review (expected exit code 1)
        run: |
          set +e
          python -m pytest -q tests/characterization/test_review_room.py --characterization-mutation=review --junitxml=output/char-mutation-review.xml
          code=$?
          set -e
          python tests/characterization/check_evidence.py mutation review "$code" output/char-mutation-review.xml
      - name: Characterization coverage against baseline (green after restore)
        if: ${{ !cancelled() }}
        run: |
          python -m coverage run --branch --source=src.operations_console_v1,src.operations_console_app -m pytest -q tests/characterization
          python -m coverage json -o output/characterization-coverage.json
          python tests/characterization/check_evidence.py coverage output/characterization-coverage.json
      - name: Upload characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: characterization-evidence
          path: output/char*
          if-no-files-found: warn


  preflight:
    needs: [change-contract, architecture-boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for release-control path mapping
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements.lock
            requirements-console.txt
            requirements-retrieval.txt
            pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python scripts/repository_preflight.py
      - name: Release-control skill mapping
        run: python scripts/release_control_preflight.py --base origin/main
      - name: Generate Product API v1 contract
        run: python scripts/product_api_contract.py --write
      - name: Upload Product API contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: product-api-v1-openapi-${{ matrix.python-version }}
          path: output/runtime/product_api_v1.openapi.json
          if-no-files-found: error
      - name: Product API v1 backward compatibility
        run: python scripts/product_api_contract.py --check --base-ref origin/main
      - run: python -m compileall -q src tests

  suite:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports:
          - 5432:5432
        volumes:
          - /tmp/metis-test-postgres-socket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both timed suites use the same local server and transport. The image's
      # existing local socket avoids repeating TCP/SCRAM setup for each query
      # connection; host authentication and durability settings stay unchanged.
      METIS_TEST_POSTGRES_DSN: host=/tmp/metis-test-postgres-socket dbname=metis_test user=postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for release-control path mapping
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements.lock
            requirements-console.txt
            requirements-retrieval.txt
            pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - name: Require PostgreSQL command-line test tooling before the suite
        run: psql --version
      - name: Measure unchanged database fixture alternatives once per Python
        if: matrix.shard == 0
        run: |
          mkdir -p output/shard
          python scripts/benchmark_test_database.py > output/shard/d6a-database-benchmark.json
      - name: Execute complete suite partition with live test names and timings
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p output/shard
          python scripts/measure_test_suite.py --output output/shard/result.json \
            --shard-index "$SHARD_INDEX" --shard-count 4
      - name: Preserve executed shard evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: suite-shard-${{ matrix.python-version }}-${{ matrix.shard }}
          path: output/shard/
          if-no-files-found: error

  browser:
    needs: [preflight]
    # Keep the OS compatible with the pinned Playwright in install-test-browser.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports:
          - 5432:5432
        volumes:
          - /tmp/metis-test-postgres-socket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both timed suites use the same local server and transport. The image's
      # existing local socket avoids repeating TCP/SCRAM setup for each query
      # connection; host authentication and durability settings stay unchanged.
      METIS_TEST_POSTGRES_DSN: host=/tmp/metis-test-postgres-socket dbname=metis_test user=postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main for release-control path mapping
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements.lock
            requirements-console.txt
            requirements-retrieval.txt
            pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - name: Install isolated browser test tooling
        uses: ./.github/actions/install-test-browser
      - name: Verify desktop, mobile and document workflows independently
        run: |
          export METIS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/metis-browser/node_modules/playwright"
          export METIS_BROWSER_EXECUTABLE="$(node -e 'process.stdout.write(require(process.env.METIS_PLAYWRIGHT_MODULE).chromium.executablePath())')"
          pytest -v --junitxml=output/browser.xml --basetemp="$RUNNER_TEMP/metis-browser-proof" \
            tests/test_browser_knowledge_context.py tests/test_browser_deploy_check.py \
            tests/test_browser_source_selection.py tests/test_browser_view_check.py \
            tests/test_review_formation_problems.py::test_real_browser_navigation_and_raad_read_only \
            tests/test_section_incident.py::test_real_authenticated_browser_route_exports_correlated_evidence
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse('output/browser.xml')
          assert list(root.iter('testcase')), 'Missing executed browser proof'
          assert not list(root.iter('skipped')), 'Browser proof must execute'
          PYCODE
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: review-browser-desktop-mobile
          path: |
            output/browser.xml
            ${{ runner.temp }}/metis-browser-proof/
          if-no-files-found: error

  # Preserve the existing required check names; these aggregate executed proof.
  test:
    if: ${{ !cancelled() }}
    needs: [preflight, suite, browser, characterization-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports:
          - 5432:5432
        volumes:
          - /tmp/metis-test-postgres-socket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both timed suites use the same local server and transport. The image's
      # existing local socket avoids repeating TCP/SCRAM setup for each query
      # connection; host authentication and durability settings stay unchanged.
      METIS_TEST_POSTGRES_DSN: host=/tmp/metis-test-postgres-socket dbname=metis_test user=postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies for conditional historical reproduction
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/d6a') || github.head_ref == 'fix/a08-review-completion')
        run: pip install -r requirements-dev.lock && pip install --no-deps --no-build-isolation -e .
      - name: D6a baseline on the unchanged main base
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/d6a') && matrix.python-version == '3.13'
        run: python scripts/measure_test_suite.py --ref 9fa2004 --output output/d6a-before.json
      - name: Download all executed suite shards
        uses: actions/download-artifact@v4
        with:
          pattern: suite-shard-${{ matrix.python-version }}-*
          path: ${{ runner.temp }}/suite-shards
      - name: Require complete executed suite with zero PostgreSQL skips
        if: ${{ !cancelled() }}
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          args=()
          if [ -f output/d6a-before.json ]; then args+=(--baseline output/d6a-before.json); fi
          mkdir -p output
          cp "$RUNNER_TEMP/suite-shards/suite-shard-$EXPECTED_PYTHON-0/d6a-database-benchmark.json" output/
          python scripts/ci_test_shards.py merge --directory "$RUNNER_TEMP/suite-shards" \
            --count 4 --python-version "$EXPECTED_PYTHON" --commit "$(git rev-parse HEAD)" \
            --output output/d6a-after.json "${args[@]}"
      - name: Upload suite timing and executed test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: suite-timing-${{ matrix.python-version }}
          path: output/d6a-*
          if-no-files-found: warn
      - name: D5 PostgreSQL lifecycle without disk mirrors
        if: ${{ !cancelled() }}
        run: |
          python scripts/export_test_evidence.py --source output/d6a-after.xml --output output/pg-without-mirrors.xml tests/test_pg_console_without_disk_mirrors.py tests/test_d5_pg_recovery_and_source_v1.py tests/test_d5_code_rollback_postgres.py tests/test_d5_two_workers_postgres.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse('output/pg-without-mirrors.xml').getroot()
          required = {
              'test_pg_console_without_disk_mirrors[': 2,
              'test_pg_backup_restore_without_runtime_then_resume_lifecycle[': 2,
              'test_azure_corrupt_blob_blocks_publish_and_build_app': 1,
              'test_release_commit_survives_envelope_failure_and_startup_repairs_it': 1,
              'test_process_exit_mid_command_rolls_back_before_restart[': 2,
              'test_code_rollback_rebuilds_copies_and_preserves_pg_and_product_api[': 2,
              'test_two_worker_review_conflicts_without_any_disk_mirror[': 2,
          }
          names = [case.get('name', '') for case in root.iter('testcase')]
          for prefix, count in required.items():
              assert sum(name.startswith(prefix) for name in names) == count, f'Missing D5 evidence: {prefix}'
          assert not list(root.iter('failure')) and not list(root.iter('error'))
          assert not list(root.iter('skipped')), 'D5 requires executed proof without skip or xfail'
          PYCODE
      - name: Upload D5 lifecycle, recovery and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: pg-without-mirrors-${{ matrix.python-version }}
          path: output/pg-without-mirrors.xml
          if-no-files-found: error
      - name: Verify reprocessing owner guard and PG state against native PostgreSQL (#708)
        if: ${{ !cancelled() }}
        run: |
          python scripts/export_test_evidence.py --source output/d6a-after.xml --output output/reprocessing-708.xml tests/test_708_reprocessing_guard_postgres.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("output/reprocessing-708.xml").getroot()
          assert list(root.iter("testcase")), "No reprocessing evidence"
          assert not list(root.iter("skipped")), "Reprocessing PostgreSQL proof skipped"
          assert not list(root.iter("failure")) and not list(root.iter("error")), "Reprocessing PostgreSQL proof failed"
          PYCODE
      - name: Verify blockage diagnostics and native read-only access
        if: ${{ !cancelled() }}
        run: |
          python scripts/export_test_evidence.py --source output/d6a-after.xml --output output/blockage-diagnostics.xml tests/test_blockage_diagnostics_v1.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("output/blockage-diagnostics.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases and any("postgres" in c.get("name", "") for c in cases), "No native blockage proof"
          assert not list(root.iter("skipped")), "Blockage diagnostics proof skipped"
          assert not list(root.iter("failure")) and not list(root.iter("error")), "Blockage diagnostics proof failed"
          print(f"Blockage diagnostics: {len(cases)} executed, zero skipped, zero failures/errors")
          PYCODE
      - name: Verify publication refusal store against native PostgreSQL (#637, PASSED proof)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail; mkdir -p output
          python scripts/export_test_evidence.py --source output/d6a-after.xml --output output/refusal-postgres.xml tests/test_publish_refusal_audit_postgres_v1.py tests/test_migration_018_postgres_v1.py | tee output/refusal-postgres.txt
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("output/refusal-postgres.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "Refusal PostgreSQL evidence is empty"
          assert not list(root.iter("skipped")), "Refusal PostgreSQL tests MAG NIET skip"
          assert not list(root.iter("failure")) and not list(root.iter("error")), "Refusal PostgreSQL tests failed"
          print(f"Refusal PostgreSQL: {len(cases)} PASSED, zero skipped, zero failures/errors")
          PYCODE
      - name: Verify A10 source repair against native PostgreSQL
        if: ${{ !cancelled() }}
        run: python scripts/export_test_evidence.py --source output/d6a-after.xml --output output/a10-native.xml tests/test_a10_source_cache_repair.py
      - name: Require executed A10 evidence without skipped cases
        if: ${{ !cancelled() }}
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("output/a10-native.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "A10 evidence is empty"
          assert not list(root.iter("skipped")), "A10 acceptance skipped required cases"
          assert not list(root.iter("failure")) and not list(root.iter("error")), "A10 acceptance failed"
          assert any("historical_merge" in case.get("name", "") and "postgres" in case.get("name", "") for case in cases), "Missing native historical merge proof"
          print(f"A10: {len(cases)} executed, zero skipped, zero failures/errors")
          PYCODE
      - name: Upload A10 native acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: a10-native-${{ matrix.python-version }}
          path: output/a10-native.xml
          if-no-files-found: error
      - name: Prove A08 review regressions on the unchanged merged base
        if: github.head_ref == 'fix/a08-review-completion' || github.ref == 'refs/heads/fix/a08-review-completion'
        run: |
          git worktree add --detach "$RUNNER_TEMP/a08-before" 76da2d7e29e3b8af8e1fb411f27f22d99930e1c3
          cp tests/test_a08_heading_batch_atomic.py "$RUNNER_TEMP/a08-before/tests/test_a08_heading_batch_atomic.py"
          cd "$RUNNER_TEMP/a08-before"
          set +e
          pytest -q tests/test_a08_heading_batch_atomic.py -k 'native_post_commit_refresh_failure or native_batch_and_single_review_use_consistent_lock_order or native_final_commit_failure' --junitxml="$GITHUB_WORKSPACE/output/a08-before.xml"
          result=$?
          set -e
          test "$result" -eq 1
          cd "$GITHUB_WORKSPACE"
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("output/a08-before.xml").getroot()
          cases = list(root.iter("testcase"))
          failed = [case for case in cases if case.find("failure") is not None]
          assert len(cases) == 15 and len(failed) == 13
          assert not list(root.iter("skipped")) and not list(root.iter("error"))
          post_commit = [case for case in failed if "native_post_commit_refresh_failure" in case.get("name", "")]
          assert len(post_commit) == 10
          assert all("Committed batch reported failure" in case.find("failure").get("message", "") for case in post_commit)
          lock = next(case for case in failed if "consistent_lock_order" in case.get("name", ""))
          trace = ET.tostring(lock, encoding="unicode")
          assert "DeadlockDetected" in trace or "40P01" in trace, "Missing actual native deadlock evidence"
          print("A08 unchanged base: 10 committed-result failures, 1 native deadlock, 2 masked COMMIT errors; 2 true rollback controls passed; zero skipped")
          PYCODE
      - name: Upload A08 unchanged-base reproduction evidence
        if: always() && (github.head_ref == 'fix/a08-review-completion' || github.ref == 'refs/heads/fix/a08-review-completion')
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: a08-before-${{ matrix.python-version }}
          path: output/a08-before.xml
          if-no-files-found: error
      - name: Verify A08 atomic heading batches against native PostgreSQL
        if: ${{ !cancelled() }}
        run: python scripts/export_test_evidence.py --source output/d6a-after.xml --output output/a08-native.xml tests/test_a08_heading_batch_atomic.py
      - name: Require executed A08 native evidence without skipped cases
        if: ${{ !cancelled() }}
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("output/a08-native.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "A08 evidence is empty"
          assert not list(root.iter("skipped")), "A08 acceptance skipped required cases"
          assert not list(root.iter("failure")) and not list(root.iter("error")), "A08 acceptance failed"
          required = (
              "test_native_final_commit_failure",
              "test_concurrent_same_revision_preserves_winner[postgres]",
              "test_second_object_storage_conflict_rolls_back_batch[postgres]",
              "test_native_post_commit_refresh_failure_preserves_success",
              "test_native_batch_and_single_review_use_consistent_lock_order",
              "test_batch_and_single_review_overlap_preserves_winner[postgres-single]",
          )
          for name in required:
              assert any(name in case.get("name", "") for case in cases), f"Missing executed native case: {name}"
          print(f"A08: {len(cases)} executed, zero skipped, zero failures/errors")
          PYCODE
      - name: Upload A08 native acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: a08-native-${{ matrix.python-version }}
          path: output/a08-native.xml
          if-no-files-found: error
      - name: Verify durable processing trace and restart evidence
        if: ${{ !cancelled() }}
        run: |
          python scripts/export_test_evidence.py --source output/d6a-after.xml --output output/processing-trace.xml tests/test_processing_trace_v1.py
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("output/processing-trace.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases and any("postgres" in c.get("name", "") for c in cases), "Missing native trace proof"
          assert not list(root.iter("skipped")), "Processing trace proof must execute every backend"
          assert not list(root.iter("failure")) and not list(root.iter("error")), "Processing trace proof failed"
          PYCODE
      - name: Require every existing CI gate
        if: ${{ !cancelled() }}
        env:
          REQUIRED_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python - <<'PYCODE'
          import os
          assert all(r == 'success' for r in os.environ['REQUIRED_RESULTS'].split(',')), 'An upstream CI gate failed or was skipped'
          PYCODE

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser, characterization-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-console.txt
      - name: Create fully deployable package once
        run: bash scripts/create_azure_deploy_package.sh "$RUNNER_TEMP/verified-package/metis-console.zip"
      - name: Verify packaged imports and bind package to CI identity
        env:
          PACKAGE_COMMIT: ${{ github.sha }}
          PACKAGE_REPOSITORY: ${{ github.repository }}
          PACKAGE_RUN_ID: ${{ github.run_id }}
          PACKAGE_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/verified_deploy_artifact.py seal
          --directory "$RUNNER_TEMP/verified-package"
          --commit "$PACKAGE_COMMIT" --repository "$PACKAGE_REPOSITORY"
          --run-id "$PACKAGE_RUN_ID" --attempt "$PACKAGE_ATTEMPT"
      - name: Preserve immutable deploy package and manifest
        uses: actions/upload-artifact@v4
        with:
          name: metis-console-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-package/
          retention-days: 30
          if-no-files-found: error
