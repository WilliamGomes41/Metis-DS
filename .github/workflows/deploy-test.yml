name: deploy-test

# Protocol v2.22 wave C / owner lock 2026-09-03: MUST NOT activate until
# Azure App Service vvn-metis-console-test exists. No on.push deploy to
# test or production while that app does not exist. Merge to main MUST NOT
# auto-deploy. Owner sets METIS_TEST_APP_READY=true only after the named
# test app exists. This PR does not create that app. MUST NOT merge PR #82.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Volledige SHA van de geslaagde main-CI-run'
        required: true
        type: string
      ci_run_id:
        description: 'Run-ID van de geslaagde ci-workflow op main met het deploymentpakket'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: metis-test-deployment
  cancel-in-progress: true

jobs:
  inactive-until-test-app:
    name: Fail-closed until vvn-metis-console-test exists
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deploy while the named test app is missing
        run: |
          if [ "${{ vars.METIS_TEST_APP_READY }}" = "true" ]; then
            echo "METIS_TEST_APP_READY is true; deploy job may run"
          else
            echo "deploy-test remains inactive: vvn-metis-console-test is not declared ready"
            exit 1
          fi

  deploy:
    name: Deploy to test
    if: ${{ vars.METIS_TEST_APP_READY == 'true' }}
    needs: inactive-until-test-app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    env:
      METIS_TEST_APP_READY: ${{ vars.METIS_TEST_APP_READY }}
      AZURE_TEST_WEBAPP_NAME: ${{ vars.AZURE_TEST_WEBAPP_NAME }}
      METIS_DEPLOY_ENVIRONMENT: test
      METIS_DEPLOY_IDENTITY: metis-deploy-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Validate test commit is on main
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "${#REQUESTED_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fail-closed activation and identity gate
        run: |
          python -c "from src.deploy_identity_v1 import require_deploy_activation, require_activation_from_env, TEST_APP; require_deploy_activation(ready_flag='${{ vars.METIS_TEST_APP_READY }}', declared_app=TEST_APP); require_activation_from_env()"
      - name: Verify successful exact main CI run
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_RUN: ${{ inputs.ci_run_id }}
          REQUESTED_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/verified_deploy_artifact.py run
          --commit "$REQUESTED_SHA" --repository "$REQUESTED_REPOSITORY"
          --run-id "$REQUESTED_RUN"
      - name: Download the package from the verified CI attempt
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.proof.outputs.artifact_name }}
          path: ${{ runner.temp }}/verified-package
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Verify package hash and embedded commit before Azure
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_RUN: ${{ inputs.ci_run_id }}
          REQUESTED_REPOSITORY: ${{ github.repository }}
          VERIFIED_ATTEMPT: ${{ steps.proof.outputs.attempt }}
        run: >-
          python scripts/verified_deploy_artifact.py verify
          --directory "$RUNNER_TEMP/verified-package"
          --commit "$REQUESTED_SHA" --repository "$REQUESTED_REPOSITORY"
          --run-id "$REQUESTED_RUN" --attempt "$VERIFIED_ATTEMPT"
      - name: Sign in to Azure using the test deploy identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_TEST_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure per-environment storage app settings (no secrets)
        run: >-
          az webapp config appsettings set
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_TEST_WEBAPP_NAME }}"
          --settings
          G2_STORAGE_ACCOUNT="${{ vars.AZURE_TEST_STORAGE_ACCOUNT || 'aidataservice' }}"
          G2_BLOB_CONTAINER="${{ vars.AZURE_TEST_BLOB_CONTAINER || 'canonical-sources-test' }}"
          CONSOLE_DATA_ROOT="/home/data/metis-console-test"
          CONSOLE_PUBLIC_ORIGIN="${{ vars.AZURE_TEST_APP_URL }}"
          WEB_CONCURRENCY="1"
          CONSOLE_INSTANCE_COUNT="1"
      - name: Deploy application code only
        run: >-
          az webapp deploy
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_TEST_WEBAPP_NAME }}"
          --src-path "$RUNNER_TEMP/verified-package/metis-console.zip"
          --type zip
          --clean true
          --async false
      - name: Verify test health
        env:
          APP_URL: ${{ vars.AZURE_TEST_APP_URL }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: >-
          python scripts/verify_console_deployment.py
          --health-url "${APP_URL}/health"
          --expected-commit "$REQUESTED_SHA"
