name: build-manual-deploy-package

on:
  push:
    branches:
      - ops/build-deploy-a87041d6

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a87041d6bb362aed77741313f24473bc32883b9e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python scripts/repository_preflight.py
      - run: pytest -q
      - name: Build deploy ZIP
        run: bash scripts/create_azure_deploy_package.sh "$RUNNER_TEMP/metis-console-a87041d6.zip"
      - name: Verify deploy ZIP contents
        run: |
          python - <<'PY'
          import os, zipfile
          p = os.path.join(os.environ["RUNNER_TEMP"], "metis-console-a87041d6.zip")
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              required = {
                  "data/audit/semantic_passage_safety_v1.json",
                  "config/deployed_commit.txt",
                  "src/console_asgi.py",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"missing: {missing}")
              marker = z.read("config/deployed_commit.txt").decode().strip()
              if marker != "a87041d6bb362aed77741313f24473bc32883b9e":
                  raise SystemExit(f"wrong deploy marker: {marker}")
          print("deploy zip verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metis-console-a87041d6
          path: ${{ runner.temp }}/metis-console-a87041d6.zip
          if-no-files-found: error
          retention-days: 3
