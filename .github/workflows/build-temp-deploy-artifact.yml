name: Build exact Metis ZIP 67e913aa

on:
  push:
    branches:
      - artifact/deploy-67e913aa

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: 67e913aaa5e74e749602b40ce3568c1b3157f468

      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "67e913aaa5e74e749602b40ce3568c1b3157f468"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deploy ZIP with repository packaging route
        run: |
          python -m pip install --upgrade pip
          bash scripts/create_azure_deploy_package.sh metis-console-67e913aa-azure.zip

      - name: Verify ZIP and full commit marker
        run: |
          unzip -t metis-console-67e913aa-azure.zip
          unzip -p metis-console-67e913aa-azure.zip config/deployed_commit.txt | tee deployed_commit.txt
          test "$(tr -d '\r\n' < deployed_commit.txt)" = "67e913aaa5e74e749602b40ce3568c1b3157f468"
          sha256sum metis-console-67e913aa-azure.zip | tee metis-console-67e913aa-azure.zip.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: metis-console-67e913aa-azure
          path: |
            metis-console-67e913aa-azure.zip
            metis-console-67e913aa-azure.zip.sha256
            deployed_commit.txt
          if-no-files-found: error
          retention-days: 7
