name: Build exact Metis ZIP 748b8868

on:
  push:
    branches:
      - artifact/deploy-748b8868

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: 748b8868017f2b79e44d0189854324949e9499b7

      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "748b8868017f2b79e44d0189854324949e9499b7"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deploy ZIP with repository packaging route
        run: |
          python -m pip install --upgrade pip
          bash scripts/create_azure_deploy_package.sh metis-console-748b8868-azure.zip

      - name: Verify ZIP and full commit marker
        run: |
          unzip -t metis-console-748b8868-azure.zip
          unzip -p metis-console-748b8868-azure.zip config/deployed_commit.txt | tee deployed_commit.txt
          test "$(tr -d '\r\n' < deployed_commit.txt)" = "748b8868017f2b79e44d0189854324949e9499b7"
          sha256sum metis-console-748b8868-azure.zip | tee metis-console-748b8868-azure.zip.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: metis-console-748b8868-azure
          path: |
            metis-console-748b8868-azure.zip
            metis-console-748b8868-azure.zip.sha256
            deployed_commit.txt
          if-no-files-found: error
          retention-days: 7
