name: workflow-topology-proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  topology-and-review:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metis_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      METIS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/metis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock
      - name: Prove topology admission and preserved R+ review scenarios
        run: >-
          python -m pytest -q
          tests/test_718_workflow_topology.py
          tests/test_console_asgi_persistence.py
          tests/test_canonical_store_azure_requirement_v1.py
          tests/test_665_tier_d_refused_postgres.py
          tests/test_a08_heading_batch_atomic.py
          tests/test_review_batch_atomic_postgres.py
          tests/test_r2_rollback_remirror_postgres.py
          tests/test_r2_restore_overwrites_concurrent_review_postgres.py
          tests/test_r2_write_bundle_object_loss_postgres.py
          tests/test_r2_i2_caught_nested_fault.py
          tests/test_678_store_command_postgres.py
          tests/test_741_participation_store_command.py
          tests/test_741_decision_command_store_command.py
          tests/test_review_participation_management.py
          tests/test_workflow_transaction_v1.py
          tests/test_live_v1_working_v2_v1.py
          tests/test_vsa_publish_document_v1.py
          tests/test_a03_formation_coverage.py
          --junitxml=topology-proof.xml
      - name: Require native #741 store-command evidence
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse("topology-proof.xml").getroot()
          for module in ("test_741_participation_store_command", "test_741_decision_command_store_command"):
              cases = [case for case in root.iter("testcase")
                       if case.get("classname", "").endswith(module)]
              assert cases, f"No native ownership evidence: {module}"
              assert not any(case.find(tag) is not None for case in cases
                             for tag in ("skipped", "failure", "error")), f"Proof skipped or failed: {module}"
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-proof
          path: topology-proof.xml
