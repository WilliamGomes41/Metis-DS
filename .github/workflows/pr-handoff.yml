name: PR handoff

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  handoff-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.2 PyYAML==6.0.3
      - name: Prove sync and merge-policy boundaries
        run: python -m pytest --noconftest -q tests/test_linear_github_sync.py tests/test_github_merge_policy.py
      - name: Require exact-head handoff
        run: python scripts/linear_github_sync.py --validate-event "$GITHUB_EVENT_PATH"
