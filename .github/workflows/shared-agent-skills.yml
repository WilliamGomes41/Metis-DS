name: Shared agent skills

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.gitattributes'
      - '.claude/skills/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/shared-agent-skills.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'config/shared_agent_skills.v1.json'
      - 'docs/agents/shared-skills.md'
      - 'scripts/sync_shared_agent_skills.py'
      - 'tests/test_shared_agent_skills.py'
  push:
    paths:
      - '.agents/**'
      - '.gitattributes'
      - '.claude/skills/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/shared-agent-skills.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'config/shared_agent_skills.v1.json'
      - 'docs/agents/shared-skills.md'
      - 'scripts/sync_shared_agent_skills.py'
      - 'tests/test_shared_agent_skills.py'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_shared_agent_skills.py --check
      - run: python -m unittest discover -s tests -p test_shared_agent_skills.py -v
