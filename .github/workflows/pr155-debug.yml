name: pr155-debug

on:
  push:
    branches:
      - fix/review-closed-loop

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - name: Capture focused pytest output
        shell: bash
        run: |
          set +e
          pytest tests/test_closed_review_loop_v1.py -q > pr155-debug.txt 2>&1
          code=$?
          echo "exit_code=$code" >> pr155-debug.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr155-debug
          path: pr155-debug.txt
