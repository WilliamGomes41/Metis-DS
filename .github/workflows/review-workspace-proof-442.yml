name: Review workspace visual proof 442
on:
  push:
    branches: [artifact/review-workspace-proof-442]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Render and verify review layouts
        run: PYTHONPATH=. python .github/scripts/direct_workspace_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-workspace-proof-442
          path: layout-proof/
          if-no-files-found: error
          retention-days: 7
