name: GitHub Linear sync

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed, ready_for_review]
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  handoff-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.2 PyYAML==6.0.3
      - name: Prove sync boundaries
        run: python -m pytest --noconftest -q tests/test_linear_github_sync.py
      - name: Require exact-head handoff
        run: python scripts/linear_github_sync.py --validate-event "$GITHUB_EVENT_PATH"

  # PR, issue and comment events only ask main to run the serialized reconcile.
  # A concurrency group keeps one pending run and cancels the older pending one.
  # Run from the event itself, that cancellation showed as a failed check on the
  # PR. Every reconcile is a full, idempotent sync, so a replaced run loses nothing.
  request-sync:
    if: >-
      github.repository == 'WilliamGomes41/Metis-DS' &&
      (github.event_name == 'pull_request_target' || github.event_name == 'issues' ||
       github.event_name == 'issue_comment')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # No checkout: nothing from a PR branch runs with this token.
      - name: Start the serialized sync on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run linear-github-sync.yml --repo "$GITHUB_REPOSITORY" --ref main

  reconcile:
    if: >-
      github.repository == 'WilliamGomes41/Metis-DS' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-linear-sync-MET
      cancel-in-progress: false
    steps:
      # Privileged events never check out or execute code from a PR branch.
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize facts, preserving all issue authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python scripts/linear_github_sync.py --apply
