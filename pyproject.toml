[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vvn-data-service"
version = "0.1.0"
description = "V&VN Data Services pilot: deterministic clinical knowledge pipeline and retrieval acceptance tooling"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema==4.26.0",
  "rfc3987==1.3.8",
  "PyMuPDF==1.26.7",
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "python-multipart==0.0.20",
  "gunicorn==23.0.0",
  "azure-identity==1.25.3",
  "azure-storage-blob==12.30.1",
]

[project.optional-dependencies]
retrieval = [
  "scikit-learn==1.8.0",
  "numpy==2.3.5",
  "scipy==1.17.0",
  "openpyxl==3.1.5",
]
dev = ["pytest==9.0.2", "coverage>=7.0", "httpx==0.28.1"]

[project.scripts]
vvn-data-service = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
